<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE CELESTIAL : PROJECT</title>
<meta name="description" content="ศิลปินผู้ชนะและเพลย์ลิสต์ของ THE CELESTIAL : PROJECT คอมมูนิตี้ Idol Survival Role-Play ที่ใช้เสียงร้องจริง">
<meta name="theme-color" content="#04161B">
<meta property="og:title" content="THE CELESTIAL : PROJECT">
<meta property="og:image" content="assets/img/og.jpg">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preload" href="assets/img/moon.png" as="image">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/pages.css">
<style>.landing .sky{background:none}</style>
</head>
<body class="landing" data-page="index">
<div class="sky" aria-hidden="true"></div>
<header class="ld-top">
  <a class="ld-brand" href="home.html"><img src="assets/img/emblem.png" alt="" width="46" height="40"><span>THE CELESTIAL<br>: PROJECT</span></a>
  <a class="btn btn-ghost btn-sm" href="home.html">ข้ามไปหน้าเว็บไซต์</a>
</header>
<main class="ld-stage">
  <div class="ld-moon">
    <img src="assets/img/moon.png" alt="" width="1000" height="1000">
    <span class="ring" aria-hidden="true"></span>
    <div class="ld-name"><small id="wSeason">THE WINNER</small><h1 id="wName">THE CELESTIAL</h1></div>
  </div>
  <p class="ld-tag" id="wTag"></p>
  <div class="ld-tabs" id="wTabs" role="tablist" aria-label="เลือกศิลปิน"></div>
  <div class="ld-members" id="wMembers"></div>
  <section class="player panel" aria-label="เพลย์ลิสต์">
    <div class="cover" id="cover"></div>
    <div class="now">
      <small>NOW PLAYING</small>
      <h2 id="tTitle">—</h2>
      <p id="tArtist"></p>
      <div class="controls">
        <button class="ctl" id="pPrev" type="button" aria-label="เพลงก่อนหน้า"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ctl play" id="pPlay" type="button" aria-label="เล่น"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="ctl" id="pNext" type="button" aria-label="เพลงถัดไป"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
        <a class="btn btn-ghost btn-sm hide" id="pYt" target="_blank" rel="noopener">YouTube</a>
      </div>
      <div class="seek"><span id="tCur">0:00</span><input type="range" id="seekBar" min="0" max="1000" value="0" aria-label="ตำแหน่งเพลง"><span id="tDur">0:00</span></div>
      <p class="muted" id="tNote" style="font-size:13px;margin-top:8px"></p>
    </div>
    <ul class="tracks" id="tracks"></ul>
  </section>
  <div class="enter">
    <a class="btn btn-rose" href="home.html">เข้าสู่เว็บไซต์</a>
    <small id="season">THE CELESTIAL : PROJECT</small>
  </div>
</main>
<audio id="audio" preload="metadata"></audio>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/pages/index.js"></script>
</body>
</html>
